[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-angle-pdf-dropfit"
version = "1.0.0"
description = "Auditable native-image contact-angle reanalysis for annotated laboratory PDFs"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "scikit-image>=0.23,<1",
  "Pillow>=10,<13",
  "matplotlib>=3.8,<4"
]
[project.scripts]
dropfit = "dropfit.__main__:main"
[tool.setuptools]
packages = ["dropfit"]
